<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AXXSPACE — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #7c3aed;
    --accent-glow: rgba(124,58,237,0.3);
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #10b981;
    --error: #ef4444;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .wrap { width: 100%; max-width: 420px; padding: 2rem; }
  .logo { font-family: 'Space Mono', monospace; font-size: 1.1rem; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; }
  h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 2.5rem; }
  .tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 2rem; }
  .tab { flex: 1; padding: 0.65rem; text-align: center; cursor: pointer; font-size: 0.875rem; font-weight: 500; background: var(--surface); color: var(--muted); transition: all 0.2s; border: none; font-family: inherit; }
  .tab.active { background: var(--accent); color: #fff; }
  .form-group { margin-bottom: 1.25rem; }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 0.4rem; letter-spacing: 0.05em; text-transform: uppercase; }
  input, select { width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  select option { background: var(--surface); }
  .btn { width: 100%; padding: 0.85rem; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 0.5rem; }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-top: 1rem; display: none; }
  .msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--error); display: block; }
  .msg.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--success); display: block; }
  .panel { display: none; } .panel.active { display: block; }
  .back { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--muted); }
  .back a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">AXXSPACE</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to your contributor account or access the admin panel.</p>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('member')">Member</button>
    <button class="tab" onclick="switchTab('admin')">Admin</button>
  </div>

  <!-- Member Login -->
  <div class="panel active" id="panel-member">
    <div class="form-group"><label>Email</label><input type="email" id="m-email" placeholder="you@example.com" /></div>
    <div class="form-group"><label>Password</label><input type="password" id="m-password" placeholder="••••••••" /></div>
    <button class="btn" onclick="memberLogin()">Sign in</button>
    <div class="msg" id="m-msg"></div>
    <div class="back">No account? <a href="/register.html">Register here</a></div>
  </div>

  <!-- Admin Login -->
  <div class="panel" id="panel-admin">
    <div class="form-group"><label>Admin Password</label><input type="password" id="a-password" placeholder="••••••••" /></div>
    <button class="btn" onclick="adminLogin()">Access Admin Panel</button>
    <div class="msg" id="a-msg"></div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='member'&&i===0)||(tab==='admin'&&i===1)));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
}

async function memberLogin() {
  const email = document.getElementById('m-email').value;
  const password = document.getElementById('m-password').value;
  const msg = document.getElementById('m-msg');
  msg.className = 'msg';
  if (!email || !password) { msg.className='msg error'; msg.textContent='Please fill in all fields.'; return; }
  try {
    const res = await fetch('/api/members/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
    const data = await res.json();
    if (!res.ok) { msg.className='msg error'; msg.textContent=data.detail||'Login failed.'; return; }
    localStorage.setItem('member_token', data.token);
    localStorage.setItem('contributor_id', data.contributor_id);
    localStorage.setItem('member_name', data.name);
    window.location.href = '/member';
  } catch { msg.className='msg error'; msg.textContent='Connection error. Try again.'; }
}

async function adminLogin() {
  const password = document.getElementById('a-password').value;
  const msg = document.getElementById('a-msg');
  msg.className = 'msg';
  if (!password) { msg.className='msg error'; msg.textContent='Enter the admin password.'; return; }
  try {
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password}) });
    const data = await res.json();
    if (!res.ok) { msg.className='msg error'; msg.textContent=data.detail||'Incorrect password.'; return; }
    localStorage.setItem('admin_token', data.token);
    window.location.href = '/admin';
  } catch { msg.className='msg error'; msg.textContent='Connection error. Try again.'; }
}
</script>
</body>
</html>
