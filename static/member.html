<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AXXSPACE — My Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #111118; --surface2: #16161f;
    --border: #1e1e2e; --accent: #7c3aed; --accent-glow: rgba(124,58,237,0.2);
    --text: #e8e8f0; --muted: #6b6b80; --success: #10b981; --gold: #f59e0b;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .logo { font-family: 'Space Mono', monospace; font-size: 1rem; letter-spacing: 0.15em; color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 1rem; }
  .user-badge { font-size: 0.875rem; color: var(--muted); }
  .btn-sm { padding: 0.4rem 0.9rem; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-family: inherit; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
  .btn-sm:hover { border-color: var(--accent); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
  .greeting { margin-bottom: 2rem; }
  .greeting h1 { font-size: 1.75rem; font-weight: 600; }
  .greeting p { color: var(--muted); margin-top: 0.25rem; font-size: 0.95rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2.5rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.5rem; }
  .stat-val { font-family: 'Space Mono', monospace; font-size: 1.8rem; font-weight: 700; }
  .stat-val.accent { color: var(--accent); }
  .stat-val.gold { color: var(--gold); }
  .stat-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
  .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th { text-align: left; padding: 0.6rem 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--border); }
  td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 500; background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(124,58,237,0.3); }
  .rank-badge { font-family: 'Space Mono', monospace; font-size: 0.75rem; background: rgba(245,158,11,0.1); color: var(--gold); border: 1px solid rgba(245,158,11,0.3); padding: 0.2rem 0.5rem; border-radius: 4px; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 2rem; }
  .empty { padding: 3rem; text-align: center; color: var(--muted); font-size: 0.9rem; }
  .loading { color: var(--muted); padding: 3rem; text-align: center; }
</style>
</head>
<body>
<nav>
  <div class="logo">AXXSPACE</div>
  <div class="nav-right">
    <span class="user-badge" id="nav-name">—</span>
    <button class="btn-sm" onclick="logout()">Sign out</button>
  </div>
</nav>
<main>
  <div class="greeting">
    <h1 id="greeting-name">Loading…</h1>
    <p id="greeting-sub">Your contribution summary</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Units</div>
      <div class="stat-val accent" id="stat-units">—</div>
      <div class="stat-sub">Contribution units earned</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Value</div>
      <div class="stat-val gold" id="stat-eur">—</div>
      <div class="stat-sub">EUR equivalent</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Category</div>
      <div class="stat-val" id="stat-cat" style="font-size:1.1rem;margin-top:0.3rem">—</div>
      <div class="stat-sub" id="stat-rank">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Awards</div>
      <div class="stat-val" id="stat-awards">—</div>
      <div class="stat-sub">Total ledger entries</div>
    </div>
  </div>

  <div class="section-title">Ledger History</div>
  <div class="table-wrap">
    <div class="loading" id="ledger-loading">Loading ledger…</div>
    <table id="ledger-table" style="display:none">
      <thead><tr>
        <th>Date</th><th>Task</th><th>Ref</th><th>Units</th><th>Value (EUR)</th><th>Reviewer</th>
      </tr></thead>
      <tbody id="ledger-body"></tbody>
    </table>
    <div class="empty" id="ledger-empty" style="display:none">No ledger entries yet.</div>
  </div>
</main>

<script>
const token = localStorage.getItem('member_token');
if (!token) window.location.href = '/login';

async function load() {
  try {
    const res = await fetch('/api/members/me', { headers: { Authorization: 'Bearer '+token } });
    if (res.status === 401) { logout(); return; }
    const d = await res.json();
    document.getElementById('nav-name').textContent = d.name;
    document.getElementById('greeting-name').textContent = 'Hello, ' + d.name;
    document.getElementById('greeting-sub').textContent = d.category + ' contributor';
    document.getElementById('stat-units').textContent = d.total_units.toFixed(2);
    document.getElementById('stat-eur').textContent = '€' + d.total_value_eur.toFixed(2);
    document.getElementById('stat-cat').textContent = d.category;
    document.getElementById('stat-rank').textContent = 'Rank #' + d.rank + ' on leaderboard';
    document.getElementById('stat-awards').textContent = d.ledger.length;

    document.getElementById('ledger-loading').style.display = 'none';
    if (d.ledger.length === 0) { document.getElementById('ledger-empty').style.display = 'block'; return; }
    document.getElementById('ledger-table').style.display = 'table';
    const tbody = document.getElementById('ledger-body');
    tbody.innerHTML = d.ledger.map(e => `
      <tr>
        <td style="color:var(--muted);white-space:nowrap">${new Date(e.date_awarded).toLocaleDateString()}</td>
        <td>${e.task_description}</td>
        <td>${e.task_reference ? '<span class="badge">'+e.task_reference+'</span>' : '<span style="color:var(--muted)">—</span>'}</td>
        <td style="font-family:'Space Mono',monospace;color:var(--accent)">${e.units_awarded.toFixed(2)}</td>
        <td style="font-family:'Space Mono',monospace;color:var(--gold)">€${e.value_eur.toFixed(2)}</td>
        <td style="color:var(--muted)">${e.approving_reviewer}</td>
      </tr>`).join('');
  } catch { document.getElementById('ledger-loading').textContent = 'Failed to load profile.'; }
}

function logout() { localStorage.clear(); window.location.href = '/login'; }
load();
</script>
</body>
</html>
